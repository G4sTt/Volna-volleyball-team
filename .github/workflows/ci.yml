name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python / ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: [accounts, team_info]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Compile Python modules
        run: python -m compileall -q app
      - name: Check application imports and OpenAPI schema
        env:
          UPLOAD_DIR: ${{ runner.temp }}/uploads-${{ matrix.service }}
        run: |
          python - <<'PY'
          from app.main import app
          schema = app.openapi()
          assert '/health' in schema['paths']
          assert '/ready' in schema['paths']
          print(f"{app.title}: {len(schema['paths'])} API paths")
          PY

  frontend:
    name: React build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  integration:
    name: Docker builds and integration
    needs: [ python, frontend ]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    env:
      COMPOSE_FILE: .github/compose.ci.yaml
      COMPOSE_PROJECT_NAME: volna-ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate CI configuration
        run: docker compose config --quiet
      - name: Build all three Docker images
        run: docker compose build
      - name: Start isolated test environment
        run: docker compose up -d --wait --wait-timeout 180
      - name: Check functionality and prepare persistence data
        run: python scripts/smoke-test.py --base http://127.0.0.1:18088 --keep-state
      - name: Recreate containers while retaining test volumes
        run: docker compose up -d --force-recreate --wait --wait-timeout 180
      - name: Verify persistence and logout
        run: python scripts/smoke-test.py --base http://127.0.0.1:18088 --verify-persistence
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin
      - name: Publish tested Docker images
        if: github.event_name == 'push'
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"

          for service in accounts team-info frontend; do
            source_image="$(docker compose images -q "$service")"
            target_image="ghcr.io/${owner}/volleyball-team-${service}"

            docker tag "$source_image" "$target_image:sha-$GITHUB_SHA"
            docker tag "$source_image" "$target_image:$GITHUB_REF_NAME"

            docker push "$target_image:sha-$GITHUB_SHA"
            docker push "$target_image:$GITHUB_REF_NAME"
          done
      - name: Show container status and logs
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 150
      - name: Remove CI containers and test volumes
        if: always()
        run: docker compose down --volumes --remove-orphans

  gitops:
    name: Promote tested release to Argo CD
    needs: integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Render the tested release
        env:
          RELEASE_TAG: sha-${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          path = Path('deploy/desktop/kustomization.yaml')
          text, count = re.subn(r'(?m)^(\s*newTag:)\s*\S+\s*$', lambda m: m[1] + ' ' + os.environ['RELEASE_TAG'], path.read_text())
          if count != 3:
              raise SystemExit(f'Expected three image tags, found {count}')
          path.write_text(text)
          PY
          kubectl kustomize deploy/desktop > "$RUNNER_TEMP/volna-manifests.yaml"
      - name: Update the deployment branch
        run: |
          git fetch origin dev
          if [ "$(git rev-parse origin/dev)" != "$GITHUB_SHA" ]; then
            echo 'A newer source commit exists; its workflow will promote the next release.'
            exit 0
          fi

          if git ls-remote --exit-code --heads origin deploy > /dev/null; then
            git fetch origin deploy
            git switch --discard-changes -C deploy origin/deploy
          else
            git restore deploy/desktop/kustomization.yaml
            git switch --orphan deploy
          fi

          mkdir -p manifests
          cp "$RUNNER_TEMP/volna-manifests.yaml" manifests/volna.yaml
          printf '%s\n' "$GITHUB_SHA" > manifests/source-revision.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifests/volna.yaml manifests/source-revision.txt
          if git diff --cached --quiet; then
            echo 'The tested release is already promoted.'
            exit 0
          fi
          git commit -m "chore(deploy): promote sha-$GITHUB_SHA"
          git push origin HEAD:refs/heads/deploy
