apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: volna
  namespace: argocd
spec:
  description: Local VOLNA application in the default namespace
  sourceRepos:
    - https://github.com/G4sTt/Volna-volleyball-team.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: default
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ''
      kind: Secret
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: Service
    - group: ''
      kind: PersistentVolumeClaim
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
