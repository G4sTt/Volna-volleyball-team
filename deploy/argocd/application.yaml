apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: volna
  namespace: argocd
spec:
  project: volna
  source:
    repoURL: https://github.com/G4sTt/Volna-volleyball-team.git
    targetRevision: deploy
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
