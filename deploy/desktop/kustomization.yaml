apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
  - ../../K8s
images:
  - name: localhost:32000/volleyball-team-accounts
    newName: ghcr.io/g4stt/volleyball-team-accounts
    newTag: sha-ca56bebc8a1e9080a428df82adfddc35bc7563c1
  - name: localhost:32000/volleyball-team-team-info
    newName: ghcr.io/g4stt/volleyball-team-team-info
    newTag: sha-ca56bebc8a1e9080a428df82adfddc35bc7563c1
  - name: localhost:32000/volleyball-team-frontend
    newName: ghcr.io/g4stt/volleyball-team-frontend
    newTag: sha-ca56bebc8a1e9080a428df82adfddc35bc7563c1
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: (accounts|team-info|frontend)
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-credentials
  - target:
      version: v1
      kind: PersistentVolumeClaim
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
