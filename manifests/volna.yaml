---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: accounts-db
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: accounts-db
  serviceName: accounts-db
  template:
    metadata:
      labels:
        app: accounts-db
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: POSTGRES_DB
          value: accounts
        - name: POSTGRES_USER
          value: accounts_user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: accounts-db-credentials
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        image: postgres:17
        name: postgres
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - accounts_user
            - -d
            - accounts
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: "1"
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
---
